# io500 config for the ASU BeeGFS scratch array — OPTIMIZED variant.
#
# Diverges from configs/asu-beegfs.ini in three places (search for "OPT:"):
#   - [ior-easy] blockSize:    9920000m  -> 230000m
#   - [ior-hard] segmentCount: 10000000  -> 500000
#   - [mdtest-easy] n:         1000000   -> 2500000
#
# All three changes target the same problem: in the original config,
# phases exit well past the 300 s stonewall because the per-rank work
# budget is much larger than what a rank can finish in 300 s. The new
# values are right-sized so each phase stonewalls on TIME, not on
# bytes/files. Steady-state GiB/s and kIOPS are unchanged; the run is
# just shorter because the post-stonewall drain is gone.
#
# NOT for comparison against pre/post-maintenance results that used
# the original asu-beegfs.ini -- different config = different baseline.
# Use this as the starting point for future benchmark seasons. See
# TODO-After.md for the rationale tied to specific pre-maint numbers.

[global]
datadir = /scratch/acchapm1/io/io500-bench
timestamp-datadir = TRUE
resultdir = /scratch/acchapm1/io/io500-bench-results
timestamp-resultdir = TRUE
api = POSIX
drop-caches = FALSE
verbosity = 1
scc = FALSE
dataPacketType = timestamp

[debug]
stonewall-time = 300

[ior-easy]
transferSize = 2m
# OPT: was 9920000m. At 23.7 GiB/s aggregate over 80 ranks for 300 s,
# each rank can write ~89 GiB before stonewall; 230000m gives headroom
# so fast ranks still stonewall on time, not bytes. Raise if your
# per-rank write bandwidth exceeds ~3 GiB/s in steady state.
blockSize = 230000m
filePerProc = TRUE
uniqueDir = FALSE
run = TRUE

[ior-easy-write]
run = TRUE

[mdtest-easy]
# OPT: was 1000000. Original stonewalled on count (38.1 kIOPS x 671 s).
# 2.5x headroom keeps the phase time-bound at the 300 s stonewall.
n = 2500000
run = TRUE

[mdtest-easy-write]
run = TRUE

[find-easy]
run = TRUE
pfind-queue-length = 10000
pfind-steal-next = FALSE
pfind-parallelize-single-dir-access-using-hashing = FALSE

[ior-hard]
# OPT: was 10000000. At 0.57 GiB/s aggregate / 80 ranks / 47008 B,
# each rank only got through ~132K segments in 813 s -- only 1.3% of
# the 10M configured. 500K is ~10x the steady-state need; eliminates
# the post-stonewall tail without risking premature exhaustion.
segmentCount = 500000
run = TRUE

[ior-hard-write]
run = TRUE

[mdtest-hard]
n = 1000000
run = TRUE

[mdtest-hard-write]
run = TRUE

[find]
run = TRUE
pfind-queue-length = 10000
pfind-steal-next = FALSE
pfind-parallelize-single-dir-access-using-hashing = FALSE

[ior-easy-read]
run = TRUE

[mdtest-easy-stat]
run = TRUE

[ior-hard-read]
run = TRUE

[mdtest-hard-stat]
run = TRUE

[mdtest-easy-delete]
run = TRUE

[mdtest-hard-read]
run = TRUE

[mdtest-hard-delete]
run = TRUE

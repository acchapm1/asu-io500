# Smoke-test config for io500. Identical to upstream config-minimal.ini except
# that datadir points into the BeeGFS scratch (so cache and metadata behavior
# match the real benchmark). Use this to verify the install end-to-end before
# running asu-beegfs.ini.
#
# Note: a "minimal" run will report [SCORE INVALID] because stonewall-time
# defaults to 300s and the phases finish faster than that with tiny inputs.
# That is expected for a smoke test.

[global]
datadir = /scratch/acchapm1/io/io500-minimal

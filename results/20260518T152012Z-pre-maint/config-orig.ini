# io500 config for the ASU BeeGFS scratch array.
# Used to benchmark before/after maintenance — keep this file UNCHANGED between
# the two runs so the scores are comparable. If you need to tune sizes (e.g.,
# because the easy phase saturates before stonewall-time), bump them here and
# RE-RUN BOTH pre and post.
#
# Scale knobs you may need to adjust:
#   [ior-easy] blockSize        — total bytes per rank for the easy write phase
#   [ior-hard] segmentCount     — number of 47008-byte segments per rank
#   [mdtest-easy] n / [mdtest-hard] n — files per rank
#   [debug] stonewall-time      — keep at 300 for a valid score; lower for dev only
#
# Required reading: https://io500.org/rules-submission (current rules).

[global]
datadir = /scratch/acchapm1/io/io500-bench
timestamp-datadir = TRUE
resultdir = /scratch/acchapm1/io/io500-bench-results
timestamp-resultdir = TRUE
api = POSIX
# Single-node sanity runs need drop-caches; multi-node runs on dedicated
# allocations typically do not. Leave FALSE for the real benchmark unless
# you have passwordless sudo for the drop-caches command on every node.
drop-caches = FALSE
verbosity = 1
scc = FALSE
dataPacketType = timestamp

[debug]
# 300s stonewall is required for a valid IO500 score. Do not lower for
# the real pre/post-maintenance comparison.
stonewall-time = 300

[ior-easy]
transferSize = 2m
# blockSize is per-rank. 9920000m is the upstream default — way more than any
# rank will write within stonewall, so the phase stonewalls on time, not bytes.
# Leave alone unless you actually exhaust the scratch.
blockSize = 9920000m
filePerProc = TRUE
uniqueDir = FALSE
run = TRUE

[ior-easy-write]
run = TRUE

[mdtest-easy]
# Files per rank. With stonewall=300 and well-behaved metadata, raise this if
# the phase stonewalls on count instead of time.
n = 1000000
run = TRUE

[mdtest-easy-write]
run = TRUE

[find-easy]
run = TRUE
pfind-queue-length = 10000
pfind-steal-next = FALSE
pfind-parallelize-single-dir-access-using-hashing = FALSE

[ior-hard]
# 47008-byte transfers; segmentCount is per-rank.
segmentCount = 10000000
run = TRUE

[ior-hard-write]
run = TRUE

[mdtest-hard]
n = 1000000
run = TRUE

[mdtest-hard-write]
run = TRUE

[find]
run = TRUE
pfind-queue-length = 10000
pfind-steal-next = FALSE
pfind-parallelize-single-dir-access-using-hashing = FALSE

[ior-easy-read]
run = TRUE

[mdtest-easy-stat]
run = TRUE

[ior-hard-read]
run = TRUE

[mdtest-hard-stat]
run = TRUE

[mdtest-easy-delete]
run = TRUE

[mdtest-hard-read]
run = TRUE

[mdtest-hard-delete]
run = TRUE
